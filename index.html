<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); }
        button { padding: 15px 30px; font-size: 20px; border-radius: 10px; border: none; background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); }
    </style>
</head>
<body>
    <h1>Forgotten World</h1>
    <p>Счёт: <span id="score">0</span></p>
    <button id="clickBtn">Нажми меня!</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let score = 0;
        const scoreElement = document.getElementById('score');
        const clickBtn = document.getElementById('clickBtn');

        clickBtn.addEventListener('click', () => {
            score++;
            scoreElement.textContent = score;
            tg.HapticFeedback.impactOccurred('light');
        });
    </script>
</body>
</html>
